name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Sin scripts de instalación: ninguna dependencia los necesita para compilar ni probar.
      - run: npm ci --ignore-scripts

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      # Informativo hasta resolver SEG-10 (avisos de postcss dentro de next y de la cadena de eslint-config-next).
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Sin variables de InsForge: la app compila igual (la landing sale con sus textos base).
      - name: Build de producción
        run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://aguemar.com

  # Aislamiento entre empresas, inmutabilidad de lo aceptado y la lógica crítica en SQL (aceptación doble,
  # numeración concurrente, reparto de cobros, invitaciones, módulos), contra la rama staging de InsForge
  # (ARQUITECTURA.md, ADR-09). Solo llamadas a la API: sin servidor ni navegador. Usa las cuentas
  # de prueba de `npm run staging:cuentas` guardadas como secretos del repo; sin ellos se salta.
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.STAGING_INSFORGE_URL }}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.STAGING_INSFORGE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMPRESA_EMAIL: ${{ secrets.E2E_EMPRESA_EMAIL }}
      E2E_EMPRESA_PASSWORD: ${{ secrets.E2E_EMPRESA_PASSWORD }}
      E2E_EMPRESA_B_EMAIL: ${{ secrets.E2E_EMPRESA_B_EMAIL }}
      E2E_EMPRESA_B_PASSWORD: ${{ secrets.E2E_EMPRESA_B_PASSWORD }}
      # Opcional: sin él se saltan las pruebas de recordatorios de pago (db.spec.ts). Es el CRON_SECRET de staging.
      CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
        if: env.E2E_EMAIL != ''

      - uses: actions/setup-node@v7
        if: env.E2E_EMAIL != ''
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
        if: env.E2E_EMAIL != ''

      - name: Seguridad contra staging
        if: env.E2E_EMAIL != ''
        run: npx playwright test tests/e2e/seguridad.spec.ts tests/e2e/db.spec.ts --project escritorio

      - name: Sin secretos de staging
        if: env.E2E_EMAIL == ''
        run: echo "::notice::Faltan los secretos STAGING_* y E2E_* en GitHub; no se corrieron las pruebas de seguridad."
